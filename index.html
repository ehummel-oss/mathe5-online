<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathe 5 – Zahlenmengen & Zahlenfolgen</title><style>
:root{--b:#1769aa;--g:#35a66f;--y:#ffd65a;--r:#d94b4b;--ink:#26354a}*{box-sizing:border-box}
body{margin:0;font-family:"Century Gothic",Arial,sans-serif;color:var(--ink);background:#fffdf7;background-image:linear-gradient(#dfe8ef 1px,transparent 1px),linear-gradient(90deg,#dfe8ef 1px,transparent 1px);background-size:28px 28px}
main{max-width:900px;margin:auto;padding:22px}.box{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px;box-shadow:7px 7px 0 #26354a22;margin-bottom:18px}
h1{margin:0;color:var(--b);font-size:clamp(28px,5vw,44px)}.sub{font-size:17px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pill{background:var(--y);border:2px solid var(--ink);padding:8px 13px;border-radius:999px;font-weight:bold}.barbox{height:17px;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:white;margin:15px 0 6px}.bar{height:100%;background:var(--g);width:0;transition:.3s}
.q{font-size:23px;font-weight:bold;margin:12px 0 18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.ans{font:700 17px "Century Gothic",Arial;background:white;border:2px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;min-height:60px}
.ok{background:#dff5e8!important;border-color:var(--g)!important}.no{background:#fde1e1!important;border-color:var(--r)!important}.feedback{font-weight:bold;font-size:17px;min-height:30px;margin-top:13px}
.next,.restart{display:none;margin:14px auto 0;padding:12px 22px;border:2px solid var(--ink);border-radius:13px;background:var(--y);font:700 17px "Century Gothic",Arial;cursor:pointer}.result{text-align:center;display:none}.big{font-size:64px}
@media(max-width:650px){.answers{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main>
<section class="box"><div class="top"><div><h1>🔢 Zahlen-Training</h1><div class="sub">Zahlenmengen & Zahlenfolgen – Mathe 5</div></div><div class="pill" id="counter"></div></div><div class="barbox"><div class="bar" id="bar"></div></div><div class="sub">Du kommst erst weiter, wenn die Aufgabe richtig gelöst ist. ⭐</div></section>
<section class="box" id="quiz"><span class="pill" id="kind"></span><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">Weiter ➜</button></section>
<section class="box result" id="result"><div class="big">🎉</div><h1>Geschafft!</h1><p>Du hast alle 30 Aufgaben richtig gelöst. Super gearbeitet!</p><button class="restart" id="restart">Noch einmal üben ↻</button></section>
</main><script>
const Q=[
["Zahlenfolge","Wie geht die Folge weiter? 3, 5, 7, 9, …",["10","11","12","13"],1,"Immer +2."],
["Zahlenfolge","Wie geht die Folge weiter? 13, 15, 17, 19, …",["20","21","22","23"],1,"Addiere immer 2."],
["Zahlenfolge","Wie geht die Folge weiter? 4, 8, 12, 16, …",["18","19","20","22"],2,"Immer +4."],
["Zahlenfolge","Wie geht die Folge weiter? 5, 10, 15, 20, …",["21","24","25","30"],2,"Immer +5."],
["Zahlenfolge","Wie geht die Folge weiter? 30, 27, 24, 21, …",["20","19","18","17"],2,"Immer −3."],
["Zahlenfolge","Wie geht die Folge weiter? 66, 55, 45, 36, 28, …",["20","21","22","23"],1,"Die Schritte sind −11, −10, −9, −8, dann −7."],
["Zahlenfolge","Welche Zahl fehlt? 2, 6, 10, __, 18",["12","13","14","15"],2,"Immer +4."],
["Zahlenfolge","Welche Zahl fehlt? 8, 16, 18, 36, 38, __",["40","56","76","78"],2,"Abwechselnd ×2 und +2."],
["Zahlenfolge","Wie geht es weiter? 2, 6, 5, 15, 14, 42, …",["41","43","84","126"],0,"Abwechselnd ×3 und −1."],
["Zahlenfolge","Wie geht es weiter? 8, 6, 24, 22, 88, 86, …",["84","172","344","348"],2,"Abwechselnd −2 und ×4."],
["Regel erkennen","Welche Regel passt? 7, 10, 13, 16, 19, …",["immer +2","immer +3","immer ×3","immer −3"],1,"Jeder Nachfolger ist um 3 größer."],
["Regel erkennen","Welche Regel passt? 40, 35, 30, 25, …",["immer −5","immer +5","immer :5","immer −10"],0,"Immer 5 abziehen."],
["Zahlenmengen","Was ist eine Zahlenfolge?",["Eine geordnete Folge von Zahlen","Nur eine einzelne Zahl","Eine Rechenart","Ein Diagramm"],0,"Eine Zahlenfolge besteht aus Zahlen in einer bestimmten Reihenfolge."],
["Zahlenmengen","Was ist eine Menge?",["Eine Rechenaufgabe","Eine Zusammenfassung von Elementen","Eine Zahlenfolge mit genau 3 Zahlen","Eine Tabelle"],1,"Elemente können zu einer Menge zusammengefasst werden."],
["Zahlenmengen","Wie nennt man einzelne Zahlen in einer Menge?",["Folgen","Elemente","Diagramme","Vorgänger"],1,"Einzelne Zahlen heißen Elemente."],
["Zahlenmengen","Wie schreibt man die Elemente einer Menge?",["( )","[ ]","{ }","< >"],2,"Mengen werden mit geschweiften Klammern geschrieben."],
["Zahlenmengen","A = {3; 5; 7; 9}. Welche Aussage stimmt?",["5 ∈ A","6 ∈ A","2 ∈ A","10 ∈ A"],0,"5 ist Element der Menge A."],
["Zahlenmengen","A = {3; 5; 7; 9}. Welche Aussage stimmt?",["6 ∈ A","6 ∉ A","7 ∉ A","9 ∉ A"],1,"6 gehört nicht zur Menge A."],
["Zahlenmengen","Was bedeutet 7 ∈ A?",["7 ist kein Element von A","7 ist Element von A","A ist kleiner als 7","7 ist eine Menge"],1,"∈ bedeutet: ist Element von."],
["Zahlenmengen","Was bedeutet 4 ∉ B?",["4 ist Element von B","4 ist nicht Element von B","4 ist größer als B","B enthält nur 4"],1,"∉ bedeutet: ist nicht Element von."],
["Natürliche Zahlen","Welche Zahl gehört sicher zu ℕ?",["−4","3","1,5","−2,5"],1,"3 ist eine natürliche Zahl."],
["Natürliche Zahlen","Welche Menge beschreibt ℕ passend?",["{1; 2; 3; 4; …}","{−1; −2; −3; …}","{0,5; 1,5; …}","{2; 4; 6}"],0,"ℕ ist hier die Menge der natürlichen Zahlen ab 1."],
["Natürliche Zahlen","Welche Menge beschreibt ℕ₀ passend?",["{1; 2; 3; …}","{0; 1; 2; 3; …}","{−1; 0; 1; …}","{0; 2; 4; …}"],1,"ℕ₀ enthält auch die 0."],
["Natürliche Zahlen","Welche Aussage ist richtig?",["0 ∈ ℕ₀","0 ∉ ℕ₀","−1 ∈ ℕ₀","2,5 ∈ ℕ₀"],0,"0 gehört zu ℕ₀."],
["Figurenfolge","Eine Figurenfolge hat 3, 5, 7, 9, … Hölzchen. Wie viele braucht Figur 6?",["11","12","13","15"],2,"Figur 5 hat 11, Figur 6 hat 13 Hölzchen."],
["Figurenfolge","Bei 3, 5, 7, 9, …: Gibt es eine Figur mit 12 Hölzchen?",["Ja","Nein"],1,"Es kommen nur ungerade Anzahlen vor."],
["Figurenfolge","Eine Folge hat 5, 9, 12, 16, 19, 23, … Hölzchen. Was wird abwechselnd addiert?",["+4 und +3","+3 und +2","+4 und +4","+5 und +3"],0,"Die Abstände wechseln: +4, +3, +4, +3 …"],
["Figurenfolge","Kästchenfolge: 1, 3, 6, 10, 15, … Wie viele Kästchen hat Figur 6?",["18","20","21","25"],2,"Nacheinander wird +2, +3, +4, +5, +6 addiert."],
["Figurenfolge","Kästchenfolge: 1, 3, 6, 10, 15, 21, 28, … Gibt es eine Figur mit 50 Kästchen?",["Ja","Nein"],1,"Nach 45 folgt 55; 50 wird übersprungen."],
["Mix","Welche Aussage passt zu A = {2; 4; 6; 8; …}?",["5 ∈ A","6 ∈ A","7 ∈ A","9 ∈ A"],1,"6 gehört zur angegebenen Menge."]
];
let i=0; const q=document.getElementById("q"),a=document.getElementById("answers"),fb=document.getElementById("fb"),next=document.getElementById("next"),bar=document.getElementById("bar"),counter=document.getElementById("counter"),kind=document.getElementById("kind");
function draw(){let x=Q[i];q.textContent=x[1];kind.textContent=x[0];a.innerHTML=x[2].map((v,j)=>`<button class="ans" data-i="${j}">${v}</button>`).join("");fb.textContent="";next.style.display="none";counter.textContent=`${i+1} / ${Q.length}`;bar.style.width=`${i/Q.length*100}%`;document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>check(+b.dataset.i,b));}
function check(j,b){let x=Q[i];if(j===x[3]){b.classList.add("ok");fb.style.color="var(--g)";fb.textContent="✅ Richtig! "+x[4];document.querySelectorAll(".ans").forEach(z=>z.disabled=true);next.style.display="block"}else{b.classList.add("no");fb.style.color="var(--r)";fb.textContent="❌ Noch nicht. Überlege noch einmal!";setTimeout(()=>b.classList.remove("no"),650)}}
next.onclick=()=>{i++;if(i<Q.length)draw();else{document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";bar.style.width="100%";counter.textContent="30 / 30";document.getElementById("restart").style.display="inline-block"}};
document.getElementById("restart").onclick=()=>{i=0;document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";draw()};draw();
</script></body></html>
