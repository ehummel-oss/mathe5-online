let i=0, activeQ=[], activeTopic="";
const q=document.getElementById("q"),a=document.getElementById("answers"),fb=document.getElementById("fb"),next=document.getElementById("next"),bar=document.getElementById("bar"),counter=document.getElementById("counter"),kind=document.getElementById("kind"),menu=document.getElementById("menu"),quiz=document.getElementById("quiz"),result=document.getElementById("result"),hint=document.getElementById("hint");

function questionsFor(topic){
  if(topic==="Alle Themen") return [...Q];
  if(topic==="Zahlenfolgen") return Q.filter(x=>["Zahlenfolge","Regel erkennen","Figurenfolge"].includes(x[0]));
  if(topic==="Zahlenmengen") return Q.filter(x=>["Zahlenmengen","Natürliche Zahlen","Mix"].includes(x[0]));
  return Q.filter(x=>x[0]===topic);
}
function startTopic(topic){
  activeTopic=topic; activeQ=questionsFor(topic); i=0;
  menu.style.display="none"; result.style.display="none"; quiz.style.display="block";
  hint.textContent="Thema: "+topic+" – du kommst erst weiter, wenn die Aufgabe richtig gelöst ist. ⭐";
  draw();
}
function draw(){
  let x=activeQ[i];
  q.textContent=x[1]; kind.textContent=x[0];
  // Antworten bei jedem Anzeigen neu mischen, damit die richtige Lösung
  // nicht immer an derselben Position steht.
  const mixed=x[2].map((v,j)=>({v,j}));
  for(let k=mixed.length-1;k>0;k--){
    const r=Math.floor(Math.random()*(k+1));
    [mixed[k],mixed[r]]=[mixed[r],mixed[k]];
  }
  a.innerHTML=mixed.map(o=>`<button class="ans" data-i="${o.j}">${o.v}</button>`).join("");
  fb.textContent=""; next.style.display="none";
  counter.textContent=`${i+1} / ${activeQ.length}`;
  bar.style.width=`${i/activeQ.length*100}%`;
  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>check(+b.dataset.i,b));
}
function check(j,b){
  let x=activeQ[i];
  if(j===x[3]){
    b.classList.add("ok"); fb.style.color="var(--g)"; fb.textContent="✅ Richtig! "+x[4];
    document.querySelectorAll(".ans").forEach(z=>z.disabled=true); next.style.display="block";
  }else{
    b.classList.add("no"); fb.style.color="var(--r)"; fb.textContent="❌ Noch nicht. Überlege noch einmal!";
    setTimeout(()=>b.classList.remove("no"),650);
  }
}
next.onclick=()=>{
  i++;
  if(i<activeQ.length) draw();
  else{
    quiz.style.display="none"; result.style.display="block"; bar.style.width="100%";
    counter.textContent=`${activeQ.length} / ${activeQ.length}`;
    result.querySelector("p").textContent=`Du hast das Thema „${activeTopic}“ geschafft. Super gearbeitet!`;
    document.getElementById("restart").style.display="inline-block";
  }
};
function showMenu(){
  i=0; activeQ=[]; quiz.style.display="none"; result.style.display="none"; menu.style.display="block";
  counter.textContent="Thema wählen"; bar.style.width="0"; hint.textContent="Du kommst erst weiter, wenn die Aufgabe richtig gelöst ist.";
}
document.getElementById("back").onclick=showMenu;
document.getElementById("restart").onclick=()=>startTopic(activeTopic);
document.querySelectorAll(".topicbtn").forEach(b=>b.onclick=()=>startTopic(b.dataset.topic));
showMenu();
</script></body></html>
